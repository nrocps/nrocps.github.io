.glitch-active { animation: glitch-shake 0.1s infinite !important; }

.sync-target,
.btn-mega,
.btn-bracket,
.status-text,
.cli-prompt-line,
#load-status {

will-change: transform, filter, opacity;
}
.sync-target.active,
.btn-mega.active {

text-shadow: 2px 0 var(--c-cyan), -2px 0 var(--c-signal), 0 0 15px rgba(255,255,255,0.4);

}
@keyframes v5-ultra-glitch {
0% { transform: translate3d(3px, -2px, 0) scale(1.02); filter: hue-rotate(0deg) contrast(2); }
20% { transform: translate3d(-3px, 2px, 0) skewX(5deg); filter: hue-rotate(90deg) saturate(3); opacity: 0.8; }
40% { transform: translate3d(2px, 4px, 0) scale(0.98); filter: invert(0.1) contrast(3); }

function optimizeAndCacheAsset(filename, maxDimension = 512) {
return new Promise((resolve) => {
const img = new Image();
const localSrc = `Artifacts/${filename}`;
const remoteSrc = `${REPO_BASE}Artifacts/${filename}`;
const handleCanvasDrawing = async () => {
try {
if (typeof img.decode === 'function') {
await img.decode();
}
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
let w = img.naturalWidth;
let h = img.naturalHeight;
if (w > maxDimension || h > maxDimension) {
if (w > h) {
h = Math.round((h * maxDimension) / w);
w = maxDimension;
} else {
w = Math.round((w * maxDimension) / h);
h = maxDimension;
}
}
canvas.width = w;
canvas.height = h;
ctx.drawImage(img, 0, 0, w, h);
const isPng = filename.toLowerCase().endsWith('.png');
const format = isPng ? 'image/png' : 'image/jpeg';
const dataUrl = canvas.toDataURL(format, isPng ? undefined : 0.8);
OPTIMIZED_ASSET_CACHE.set(filename, dataUrl);
resolve(dataUrl);
} catch (e) {
OPTIMIZED_ASSET_CACHE.set(filename, localSrc);
resolve(localSrc);
}
};
img.onload = handleCanvasDrawing;
img.onerror = () => {
img.onerror = null;
img.onload = handleCanvasDrawing;
img.onerror = () => {
OPTIMIZED_ASSET_CACHE.set(filename, localSrc);
resolve(localSrc);
};
img.crossOrigin = "anonymous";
img.src = remoteSrc;
};
img.src = localSrc;
});
}
function getOptimizedAsset(filename) {

async function playBufferSource(category, file, type, baseVolume = 0.4, speedMultiplier = 1.0, isEcho = false) {

const gainNode = audioCtx.createGain();
const localPanner = audioCtx.createStereoPanner();

gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
let rate = speedMultiplier;

rate = (buffer.duration / 10) * rate;

source.playbackRate.setValueAtTime(Math.max(0.1, Math.min(rate, 16.0)), audioCtx.currentTime);
localPanner.pan.setValueAtTime(randomRange(-0.8, 0.8), audioCtx.currentTime);
source.connect(localPanner);

gainNode.connect(biquadFilter);
synchronizeVisualsToAudio(type, file);
triggerGlitchEngineForType(category);
source.start(0);
if (isEcho && !isCrtMuted) {
setTimeout(() => {
playBufferSource(category, file, type, baseVolume * 0.4, speedMultiplier * 0.9, false);

function makeDistortionCurve(amount) {
const k = typeof amount === 'number' ? amount : 50;
const n_samples = 44100;
const curve = new Float32Array(n_samples);
const deg = Math.PI / 180;
for (let i = 0; i < n_samples; ++i) {
const x = (i * 2) / n_samples - 1;
curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
}
return curve;
}
async function fetchAudioBufferWithFallback(folder, file) {

const localLower = `${folder.toLowerCase()}/${file}`;
const remote = `https://raw.githubusercontent.com/nrocps/nrocps/main/${folder}/${file}`;
const paths = [localUpper, localLower, remote];
for (const p of paths) {
try {
const response = await fetch(p);
if (response.ok) {
const arrayBuffer = await response.arrayBuffer();
return await audioCtx.decodeAudioData(arrayBuffer);
}
} catch (e) {
console.log(`Failed to load buffer from ${p}:`, e);
}
}
throw new Error("Unable to retrieve audio data from any target path.");
}

function parseCompressedLogs() {
let currentDay = null;
RAW_DATA = [];
RAW_SPEECH = [];
RAW_LOGS.forEach(line => {
if (!line || typeof line !== 'string') return;
const trimmed = line.trim();
if (trimmed === "") return;
if (trimmed.startsWith("D:")) {
if (currentDay && currentDay.l.length > 0) RAW_DATA.push(currentDay);
currentDay = { d: trimmed.substring(2), l: [] };
} else {
if (trimmed.length < 9) return;
const t = trimmed.substring(0, 4);
const rawIdx = trimmed.substring(4, 6);
const i = parseInt(rawIdx, 36).toString();
const s = trimmed.substring(6, 7);
const y = trimmed.substring(7, 8);
const refFlag = trimmed.substring(8, 9);
let r = "";
let content = "";
if (refFlag === "1" && trimmed.length >= 15) {
const refTime = trimmed.substring(9, 13);
const refIdx = parseInt(trimmed.substring(13, 15), 36).toString();
r = `MSG_${currentDay ? currentDay.d : '00000000'}_${refTime}_${refIdx}`;
content = trimmed.substring(15);
}
else if (refFlag === "2" && trimmed.length >= 20) {
const refDateVal = parseInt(trimmed.substring(9, 14), 36).toString();
const refTime = trimmed.substring(14, 18);
const refIdx = parseInt(trimmed.substring(18, 20), 36).toString();
r = `MSG_${refDateVal}_${refTime}_${refIdx}`;
content = trimmed.substring(20);
}
else {
r = "";
content = trimmed.substring(9);
}
if (y === 'W') {
const wParts = content.split('|');
if (wParts.length >= 3) {
RAW_SPEECH.push([parseInt(wParts[0]), wParts[1], wParts[2]]);
}
return;
}
if (y === 'A') {
const aParts = content.split('|');
if (aParts.length >= 2) {
const cat = aParts[0];
if (!AUDIO_MANIFEST[cat]) AUDIO_MANIFEST[cat] = {};
aParts[1].split(',').forEach(file => {
if (file.trim() !== "") {
AUDIO_MANIFEST[cat][file + '.mp3'] = { d: 2, mx: 0, mn: -20, p: 0 };
}
});
}
return;
}
if (currentDay) {
currentDay.l.push({ t, i, s, r, y, c: content });
}
}
});
if (currentDay && currentDay.l.length > 0) RAW_DATA.push(currentDay);
SOVEREIGN_SPEECH_DATA = RAW_SPEECH.map(item => ({
folder: F_MAP[item[0]],
file: item[1],
text: item[2]
}));
}
